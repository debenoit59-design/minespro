<!DOCTYPE html>
<html lang="fr">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>MinesPro - Mon compte</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080b14;
            color: white;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
        }

        .back {
            color: #7c9cff;
            text-decoration: none;
            font-size: 14px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #9da6ba;
            margin-bottom: 25px;
        }

        .account-box {
            background: #111625;
            border: 1px solid #29334a;
            border-radius: 16px;
            padding: 25px 20px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            margin: 0 auto 20px;
            border-radius: 50%;
            background: #20283b;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .account-title {
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .info {
            background: #080b14;
            border: 1px solid #29334a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 12px;
        }

        .info-label {
            color: #9da6ba;
            font-size: 13px;
            margin-bottom: 5px;
        }

        .info-value {
            font-size: 15px;
            word-break: break-word;
        }

        .status {
            color: #75d69c;
        }

        .logout {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            background: #20283b;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .logout:active {
            transform: scale(0.98);
        }

        .home {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #7c9cff;
            text-decoration: none;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            color: #9da6ba;
            font-size: 14px;
        }

    </style>

</head>


<body>

<div class="container">


    <div class="top">

        <div class="logo">
            💎 MinesPro
        </div>

        <a href="index.html" class="back">
            Accueil
        </a>

    </div>


    <h1>
        👤 Mon compte
    </h1>

    <p class="subtitle">
        Consultez les informations de votre compte.
    </p>


    <div class="account-box">


        <div class="avatar">
            👤
        </div>


        <div class="account-title">
            Votre espace personnel
        </div>


        <div class="info">

            <div class="info-label">
                Adresse e-mail
            </div>

            <div
                class="info-value"
                id="userEmail">

                Vérification...

            </div>

        </div>


        <div class="info">

            <div class="info-label">
                État du compte
            </div>

            <div
                class="info-value status"
                id="userStatus">

                Vérification...

            </div>

        </div>


        <button
            class="logout"
            onclick="deconnecter()">

            🚪 Se déconnecter

        </button>


        <div id="message"></div>


    </div>


    <a
        href="index.html"
        class="home">

        ← Retour au tableau de bord

    </a>


</div>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

const SUPABASE_URL =
    "https://sodewninwjavmohlfbux.supabase.co";


const SUPABASE_KEY =
    "sb_publishable_sIna3jnTX_GVHs7fxAWyPw_KJjHfucb";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


// ==============================
// VÉRIFIER LE COMPTE
// ==============================

async function verifierCompte() {

    const userEmail =
        document.getElementById("userEmail");

    const userStatus =
        document.getElementById("userStatus");


    const { data, error } =
        await supabaseClient.auth.getUser();


    if (error || !data.user) {

        window.location.href =
            "connexion.html";

        return;
    }


    userEmail.textContent =
        data.user.email;


    userStatus.textContent =
        "Connecté";
}


// ==============================
// DÉCONNEXION
// ==============================

async function deconnecter() {

    const message =
        document.getElementById("message");


    message.textContent =
        "Déconnexion en cours...";


    const { error } =
        await supabaseClient.auth.signOut();


    if (error) {

        message.textContent =
            "Erreur lors de la déconnexion.";

        return;
    }


    window.location.href =
        "connexion.html";
}


verifierCompte();

</script>


</body>

</html>
